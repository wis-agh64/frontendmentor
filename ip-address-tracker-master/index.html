<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | IP Address Tracker</title>
</head>
<body class="overflow-y-hidden">
  <header class="flex flex-col items-center w-full bg-[url(./images/pattern-bg-mobile.png)] lg:bg-[url(./images/pattern-bg-desktop.png)] bg-no-repeat bg-cover h-1/3">
    <h1 class="text-white text-2xl rubik-bold my-5">IP Address Tracker</h1>
    <div class="flex justify-center w-full">
      <input id="searchInput" class="bg-white w-65 h-15 cursor-pointer px-6 py-2 outline-0 rounded-l-xl text-lg lg:w-1/3" placeholder="Search for any IP address or domain">
      <div id="searchButton" class="bg-black cursor-pointer w-15 h-15 flex items-center justify-center rounded-r-xl"><img src="./images/icon-arrow.svg" alt="Arrow icon"></div>
    </div>
  </header>
  <main class="h-2/3 w-full flex justify-center relative">
    <div class="bg-white w-80 text-center p-8 rounded-xl absolute z-10 -top-35 lg:-top-20 lg:w-9/12 lg:flex lg:text-left lg:p-10 lg:items-baseline lg:h-[200px]">
      <div class="mb-5 lg:mr-10 lg:border-r lg:border-gray-300 lg:pr-20 lg:h-full lg:mb-0 lg:w-1/4 lg:text-wrap">
        <div class="text-xs uppercase mb-1 rubik-bolder tracking-widest text-custom-grey lg:mb-3">IP Address</div>
        <div id="ipOutput" class="rubik-bold text-xl">192.212.174.101</div>
      </div>

      <div class="mb-5 lg:mr-10 lg:border-r lg:border-gray-300 lg:pr-20 lg:h-full lg:mb-0 lg:w-1/4 lg:text-wrap">
        <div class="text-xs uppercase mb-1 rubik-bolder tracking-widest text-custom-grey lg:mb-3">Location</div>
        <div id="locationOutput" class="rubik-bold text-xl">Brooklyn, NY 10001</div>  
      </div>

      <div class="mb-5 lg:mr-10 lg:border-r lg:border-gray-300 lg:pr-20 lg:h-full lg:mb-0 lg:w-1/4 lg:text-wrap">
        <div class="text-xs uppercase mb-1 rubik-bolder tracking-widest text-custom-grey lg:mb-3">Timezone</div>
        <div id="timezoneOutput" class="rubik-bold text-xl">UTC -05:00</div>
      </div>

      <div class="lg:w-1/4 lg:text-wrap">
        <div class="text-xs uppercase mb-1 rubik-bolder tracking-widest text-custom-grey lg:mb-3">ISP</div>
        <div id="ispOutput" class="rubik-bold text-xl">SpaceX Starlink</div>
      </div>
    </div>

    <div id="map" class="h-full w-full z-0"></div>
  </main>
  <footer class="fixed bottom-0 w-full flex justify-center">
    <div class="text-xs text-center p-2 mb-1 rounded-2xl bg-blue-300 opacity-60 w-50">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      <br> 
      Coded by Wissam Alghabra.
    </div>
  </footer>
  <script src="./script.js"></script>
</body>
</html>
